# Ganglion telemetry checkpoint worker (ADR-026, TELEMETRY.md).
# Deploy: wrangler deploy   (then: wrangler secret put ID_SALT)
# The worker stores ONLY aggregate rows; request logging stays disabled.
name = "ganglion-checkpoint"
main = "worker.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "checkpoint.robotden.dev/v1/*", zone_name = "robotden.dev" },
]

[observability]
# Deliberately off: no request logs means no IPs at rest anywhere.
enabled = false

[[analytics_engine_datasets]]
binding = "AE"
dataset = "ganglion_checkpoint"
