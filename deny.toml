# cargo-deny configuration for the Ganglion workspace.
# Checked in CI by the `deny` job (.github/workflows/ci.yml).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
# Only flag unmaintained advisories for direct workspace dependencies.
# Transitive unmaintained crates (currently fxhash via libp2p and paste via
# several proc-macro users) are their parents' problem to migrate off; we
# still see vulnerability advisories for them regardless of this setting.
unmaintained = "workspace"
ignore = [
    # chrono is a direct dependency (timestamps in gang-core, the CLI and
    # five capability crates). RUSTSEC-2026-0543 is an unmaintained notice,
    # not a vulnerability: no known defect, but no fixed release will come.
    # Migrating to `jiff` or `time` touches ~14 files and the serialized
    # timestamp formats, so it is its own change, not part of unfreezing CI.
    # Review by 2027-02-20: migrate, or re-justify this entry.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (no vulnerability); migration to jiff/time tracked separately; review by 2027-02-20" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive and weak-copyleft (file-level) licenses only.
# Ganglion itself is Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    # CDLA-Permissive-2.0: the Community Data License Agreement (permissive),
    # carried by webpki-roots (the Mozilla CA certificate bundle) via ureq's
    # rustls stack for the http/egress broker (ADR-025). Data-license analog
    # of a permissive code license; standard across rustls-based HTTP stacks.
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    # MPL-2.0 is file-level copyleft; used by attohttpc and option-ext.
    "MPL-2.0",
]
confidence-threshold = 0.8

# No clarify needed for ring: since 0.17, ring declares
# `license = "Apache-2.0 AND ISC"` in its own metadata, and both
# licenses are in the allow list above.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
