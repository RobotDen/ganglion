# cargo-deny configuration for the Ganglion workspace.
# Checked in CI by the `deny` job (.github/workflows/ci.yml).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive and weak-copyleft (file-level) licenses only.
# Ganglion itself is Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-DFS-2016",
    # MPL-2.0 is file-level copyleft; used by attohttpc and option-ext.
    "MPL-2.0",
]
confidence-threshold = 0.8

# No clarify needed for ring: since 0.17, ring declares
# `license = "Apache-2.0 AND ISC"` in its own metadata, and both
# licenses are in the allow list above.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
