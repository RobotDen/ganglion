# cargo-deny configuration for the Ganglion workspace.
# Checked in CI by the `deny` job (.github/workflows/ci.yml).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
# Only flag unmaintained advisories for direct workspace dependencies.
# Transitive unmaintained crates (currently fxhash via libp2p and paste via
# several proc-macro users) are their parents' problem to migrate off; we
# still see vulnerability advisories for them regardless of this setting.
unmaintained = "workspace"
ignore = [
    # hickory-proto 0.25.x comes transitively via libp2p 0.56's `dns`
    # feature (libp2p-dns). Both advisories are DoS-class issues in DNS
    # validation/encoding paths, not remote code execution:
    #   - RUSTSEC-2026-0118: NSEC3 closest-encloser proof validation can
    #     enter an unbounded loop; fix requires hickory-proto 0.26.1.
    #   - RUSTSEC-2026-0119: O(n²) name-compression CPU blowup during
    #     message encoding; no safe upgrade — the affected code moved to
    #     hickory-net in 0.26.
    # libp2p-dns pins hickory ^0.25, so we cannot take 0.26 without a
    # libp2p bump. Revisit when libp2p updates hickory to 0.26.
    { id = "RUSTSEC-2026-0118", reason = "transitive via libp2p-dns; DoS-class (unbounded loop in NSEC3 validation); blocked on libp2p bumping hickory to 0.26" },
    { id = "RUSTSEC-2026-0119", reason = "transitive via libp2p-dns; DoS-class (O(n^2) name compression during encoding); no safe upgrade until libp2p moves to hickory 0.26/hickory-net" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive and weak-copyleft (file-level) licenses only.
# Ganglion itself is Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    # CDLA-Permissive-2.0: the Community Data License Agreement (permissive),
    # carried by webpki-roots (the Mozilla CA certificate bundle) via ureq's
    # rustls stack for the http/egress broker (ADR-025). Data-license analog
    # of a permissive code license; standard across rustls-based HTTP stacks.
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    # MPL-2.0 is file-level copyleft; used by attohttpc and option-ext.
    "MPL-2.0",
]
confidence-threshold = 0.8

# No clarify needed for ring: since 0.17, ring declares
# `license = "Apache-2.0 AND ISC"` in its own metadata, and both
# licenses are in the allow list above.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
