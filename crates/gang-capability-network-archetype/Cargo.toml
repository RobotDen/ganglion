[package]
name = "gang-capability-network-archetype"
description = "Network archetype detection v2 — classifies robot network environment with recommendations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Componentization (#28): build as a WASM component with `cargo build --target
# wasm32-wasip2 --release` (rustc emits a component directly for cdylib crates).
# rlib is kept so native unit tests and the workspace gate are unaffected.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }
