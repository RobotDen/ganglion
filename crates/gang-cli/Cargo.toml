[package]
name = "gang"
description = "CLI for Ganglion — secure connectivity and auditable tool execution for ROS 2 robot fleets on hostile networks: outbound-only reachability, signed WASM tooling, default-deny policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "network-programming", "science::robotics"]
rust-version.workspace = true

# `cargo binstall gang` — resolve the prebuilt tarball from the GitHub
# release (gang-v<version>-<target>.tar.gz, binary at the archive root)
# instead of compiling from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "gang"
path = "src/main.rs"

[dependencies]
gang-core = { path = "../gang-core", version = "2.2.0" }
gang-libp2p = { path = "../gang-libp2p", version = "2.2.0" }
gang-ros = { path = "../gang-ros", version = "2.2.0" }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
ciborium = { workspace = true }
dirs = "6"
clap_complete = "4"
toml = "1.1"
ratatui = { workspace = true }
crossterm = { workspace = true }
futures = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tempfile = { workspace = true }
