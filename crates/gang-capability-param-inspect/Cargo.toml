[package]
name = "gang-capability-param-inspect"
description = "Parameter server snapshot capability — inspects ROS 2 parameters with optional diff"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["wasm", "science::robotics"]
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Componentization (#28): build as a WASM component with `cargo build --target
# wasm32-wasip2 --release` (rustc emits a component directly for cdylib crates).
# rlib is kept so native unit tests and the workspace gate are unaffected.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }
