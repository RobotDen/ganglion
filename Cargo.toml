[workspace]
resolver = "2"
members = [
    "crates/gang-core",
    "crates/gang-wasm-host",
    "crates/gang-libp2p",
    "crates/gang-ros",
    "crates/gang-cli",
    "crates/gang-capability-diagnostics",
    "crates/gang-capability-param-inspect",
    "crates/gang-capability-diagnostic-bundle",
    "crates/gang-capability-network-archetype",
    "crates/gang-capability-log-normalize",
    "crates/gang-capability-topic-echo",
    "crates/gang-capability-canary-probe",
    "crates/gang-capability-rosbag-slice",
]
exclude = [
    "test-harness/e2e-dispatch/test-component",
]

[workspace.package]
version = "2.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/RobotDen/ganglion"
# Single README for every published crate: crates.io rewrites its relative
# links against `repository`, so the repo README renders correctly there.
readme = "README.md"
# crates.io search surface, shared by every published crate.
keywords = ["robotics", "ros2", "libp2p", "wasm", "fleet"]
rust-version = "1.88"

[workspace.dependencies]
# Async runtime.
# Library crates take this base feature set; the `gang` binary widens it to
# "full" in its own manifest (CODE-15) so downstream consumers of the library
# crates are not forced to pull all of tokio.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "net",
    "fs",
    "process",
    "signal",
] }
futures = "0.3"

# Shared across multiple crates (CODE-27: hoisted from per-crate manifests).
async-trait = "0.1"
hex = "0.4"
glob-match = "0.2"
semver = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
serde_json = "1"

# Crypto
#
# ed25519-dalek, libp2p-identity (gang-core), and libp2p form one coupled
# version train: libp2p 0.56 → libp2p-identity 0.2 → ed25519-dalek 2. Bumping
# ed25519-dalek to 3.x or libp2p-identity to 0.3.x on their own dual-versions
# the PeerId/Keypair/signature types across the crate boundary and breaks the
# build (declined in dependabot PRs #15/#16). Take those majors ONLY together
# with a libp2p release built on the new identity/dalek line.
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
# Pinned to 0.8: ed25519-dalek 2 depends on rand_core 0.6, which rand 0.8
# provides. Do NOT bump to 0.9 (rand_core 0.9) without upgrading ed25519-dalek
# in lockstep — the RNG traits are incompatible across that boundary.
rand = "0.8"
blake3 = "1"
# Guest bindings for the capability crates (wasm32 builds only).
wit-bindgen = "0.60"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
toml = "1.1"

# libp2p
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    "quic",
    "noise",
    "yamux",
    "identify",
    "ping",
    "kad",
    "relay",
    "dcutr",
    "macros",
    "dns",
    "serde",
    "request-response",
] }
# True server-push substreams for the robot→operator event feed (ADR-024).
# Pre-release: the libp2p 0.56 meta-crate exposes no `stream` feature, but
# libp2p-stream 0.4.0-alpha resolves cleanly against the locked libp2p-swarm
# 0.47.1. Pinned exactly to this pre-release so a future 0.4.0 final (or a new
# alpha) cannot silently change the wire behaviour underneath us.
libp2p-stream = "=0.4.0-alpha"

# WASM runtime
wasmtime = { version = "36", features = ["component-model"] }
wasmtime-wasi = "36"

# Terminal UI (gang-cli only — the `gang tui` live dashboard, issue #2).
# Kept out of the library crates; majors pinned. crossterm's `event-stream`
# feature integrates key input into the tokio select loop without a blocking
# input thread.
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Testing
tempfile = "3"

# Release profile tuned for a field-deployed binary + relay (CODE-16):
# smaller, faster artifacts at the cost of longer release builds. Debug builds
# are unaffected.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
