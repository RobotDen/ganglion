# Nightly chaos run — randomized netem impairment (#32).
#
# Non-blocking by design: a failure is reported on ONE open `chaos` issue
# (a new issue only when none is open; later failures add a comment). Each
# report carries the seed and the derived netem parameters inline, so the
# impairment PARAMETERS replay deterministically (./run-matrix.sh --chaos
# --seed <N>) after the run's logs and artifacts have expired. It never gates
# merges — randomized impairment as a gate trains people to re-run until green.

name: Nightly Chaos

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily (offset to avoid top-of-hour load)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  chaos:
    name: Randomized Degraded-Link Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The e2e harness builds + signs the test WASM component. Without this
      # install `cargo component build` dies instantly ("no such command") —
      # which is exactly what the first two nightly runs did, in ~4s, before
      # any impairment was ever applied. The gate job in ci.yml has the same
      # step; the nightly was missing it.
      - name: Install cargo-component (builds the e2e test component)
        run: cargo install cargo-component --locked
      - name: Run chaos profile
        id: chaos
        shell: bash
        run: |
          set -o pipefail
          SEED=$(date +%s)
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          ./test-harness/degraded-link/run-matrix.sh --chaos --seed "$SEED" 2>&1 | tee /tmp/chaos.log
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-artifacts-${{ github.run_id }}
          path: test-harness/degraded-link/artifacts/
          if-no-files-found: ignore
          retention-days: 30
      - name: Report failure on the open chaos issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const seed = '${{ steps.chaos.outputs.seed }}';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let log = '';
            try { log = fs.readFileSync('/tmp/chaos.log', 'utf8').replace(/\x1b\[[0-9;]*m/g, ''); } catch (e) {}
            const lines = log.split('\n');
            const netem = (lines.find(l => l.includes('-> netem: ')) || '').split('-> netem: ')[1]
              || '(not reached: the run failed before the profile was applied)';
            const signals = lines
              .filter(l => /exited with code|FAILED|panicked|error(\[|:)/.test(l))
              .slice(-10);
            const report = [
              `**Seed:** \`${seed}\` · **netem:** \`${netem}\` · **commit:** ${context.sha.slice(0, 7)}`,
              ``,
              '```bash',
              `./test-harness/degraded-link/run-matrix.sh --chaos --seed ${seed}`,
              '```',
              ``,
              signals.length ? ['Failure lines:', '```', ...signals, '```'].join('\n') : 'No failure line matched; see the run log.',
              ``,
              `Run: ${url} (logs and artifacts expire; everything needed to replay is above).`,
              ``,
              `The seed replays the impairment *parameters*; netem's per-packet draw is kernel RNG,`,
              `so a reproduction may need a few attempts under the same profile.`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'chaos', sort: 'created', direction: 'asc', per_page: 1,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number,
                body: `The nightly randomized degraded-link run failed again.\n\n${report}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: 'Nightly chaos run failing',
                labels: ['bug', 'chaos'],
                body: `The nightly randomized degraded-link run failed. Later failures are added here as comments until this issue is closed.\n\n${report}`,
              });
            }
