name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --all-targets

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # On failure, surface the failing test names in the step summary so the
      # cause is visible without downloading raw logs.
      - name: Run cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test 2>&1 | tee /tmp/test-out.log; then
            {
              echo "### Failing tests (${{ matrix.os }})"
              echo '```'
              grep -E "^test .* \.\.\. FAILED|panicked at|---- .* stdout ----" /tmp/test-out.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    env:
      # MSRV job checks buildability only; lint differences between compiler
      # versions should not fail it.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check --workspace --all-targets

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  harness:
    name: Docker Test Harness
    # Full multi-container network scenarios are too heavy for every PR;
    # run them on pushes to main only. This blocking set covers the
    # statically verified scenarios (flat bridge topologies).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-component (builds the e2e test component)
        run: cargo install cargo-component --locked
      - name: Open warehouse scenario
        shell: bash
        run: |
          set -o pipefail
          if ! ./test-harness/run-tests.sh --scenario open-warehouse 2>&1 | tee /tmp/harness.log; then
            {
              echo "### open-warehouse failure (last 120 lines)"
              echo '```'
              tail -120 /tmp/harness.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: E2E dispatch smoke test
        shell: bash
        run: |
          set -o pipefail
          if ! ./test-harness/e2e-dispatch/run-test.sh 2>&1 | tee /tmp/e2e.log; then
            {
              echo "### e2e smoke failure (last 120 lines)"
              echo '```'
              tail -120 /tmp/e2e.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  harness-nat:
    name: Docker Test Harness (NAT scenarios)
    # Promoted to blocking 2026-07-31: all three scenarios green in CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        scenario: [nat-office, enterprise-dmz, mobile-cgnat]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run NAT scenario
        shell: bash
        run: |
          set -o pipefail
          if ! ./test-harness/run-tests.sh --scenario ${{ matrix.scenario }} 2>&1 | tee /tmp/harness.log; then
            {
              echo "### ${{ matrix.scenario }} failure (last 120 lines)"
              echo '```'
              tail -120 /tmp/harness.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
