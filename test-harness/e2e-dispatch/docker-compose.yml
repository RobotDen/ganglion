# E2E connectivity smoke test: relay + robot + operator on a flat bridge
# network. Validates that the robot agent connects to the relay and that the
# operator can register the robot's peer ID (published via /test-data).
#
# TODO(dispatch-workstream): upgrade to a real deploy→invoke→result round-trip
# once ADR-020 Phase 32 lands — `gang deploy <remote>` currently bails because
# operator remote dispatch is not implemented in the CLI.
#
# Usage:
#   ./run-test.sh          # builds, runs, validates, tears down
#   docker compose up -d   # manual: start all services
#   docker compose logs -f # manual: watch logs

services:
  relay:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    # Dockerfile.base sets ENTRYPOINT ["gang"], so the command must NOT
    # repeat the binary name.
    command: ["relay", "--port", "4001"]
    networks:
      ganglion-e2e:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4001"]
      interval: 2s
      timeout: 5s
      retries: 10

  robot:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    # Wrapper starts `gang agent -r <relay>` and publishes the robot's peer ID
    # and agent log to /test-data for the operator to assert against.
    entrypoint: ["/bin/bash", "/test-data/run-robot.sh"]
    depends_on:
      relay:
        condition: service_healthy
    networks:
      ganglion-e2e:
        ipv4_address: 172.28.0.20
    volumes:
      - robot-data:/data
      - ./test-data:/test-data

  operator:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/test-data/run-operator-test.sh"]
    depends_on:
      relay:
        condition: service_healthy
      robot:
        condition: service_started
    networks:
      ganglion-e2e:
        ipv4_address: 172.28.0.30
    volumes:
      - ./test-data:/test-data:ro

volumes:
  robot-data:

networks:
  ganglion-e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
