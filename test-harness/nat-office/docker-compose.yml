# Scenario 2: NAT'd Office
# Single consumer NAT, no inbound ports, DHCP rotation.
# Robot dials out to relay. Operator connects via relay.
# DCUtR hole-punch upgrade attempted.

services:
  # Relay lives on the "internet" — directly reachable by both sides.
  # Fixed test identity (TEST KEY — DO NOT USE); the entrypoint wrapper
  # publishes the relay's dialable multiaddr to the shared volume.
  relay:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/relay-entrypoint.sh"]
    environment:
      GANG_KEY_PATH: /keys/relay.key
      RELAY_IP: 10.0.0.10
      RELAY_PORT: "4001"
    volumes:
      - relay-data:/data
      - ../scripts:/harness:ro
      - ../keys/nat-office-relay.key:/keys/relay.key:ro
      - relay-shared:/shared
    networks:
      internet:
        ipv4_address: 10.0.0.10

  # Robot sits behind a NAT gateway. It can reach the internet but
  # nothing on the internet can initiate a connection to it.
  robot:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/agent-entrypoint.sh"]
    # NET_ADMIN so the entrypoint can repoint the default route at the
    # NAT gateway container (Docker's bridge gateway would bypass it).
    cap_add:
      - NET_ADMIN
    environment:
      GATEWAY_IP: 192.168.1.1
    volumes:
      - robot-data:/data
      - ../scripts:/harness:ro
      - relay-shared:/shared:ro
    networks:
      robot-lan:
        ipv4_address: 192.168.1.20
    depends_on:
      - nat-gateway
      - relay

  # Operator also sits behind a separate NAT (typical home/office).
  operator:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/agent-entrypoint.sh"]
    cap_add:
      - NET_ADMIN
    environment:
      GATEWAY_IP: 192.168.2.1
    volumes:
      - operator-data:/data
      - ../scripts:/harness:ro
      - relay-shared:/shared:ro
    networks:
      operator-lan:
        ipv4_address: 192.168.2.30
    depends_on:
      - nat-gateway-operator
      - relay
      - robot

  # NAT gateway for the robot LAN.
  # Uses iptables MASQUERADE to simulate a consumer router.
  # Built from the harness base image so iptables/iproute2 are available
  # without runtime apt (which would hang on internal-only networks).
  nat-gateway:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # Interface names depend on network attachment order, so resolve
        # them from the statically assigned addresses.
        WAN_IF=$$(ip -o -4 addr show | awk '$$4 == "10.0.0.20/24" {print $$2}')
        LAN_IF=$$(ip -o -4 addr show | awk '$$4 == "192.168.1.1/24" {print $$2}')
        iptables -t nat -A POSTROUTING -o "$$WAN_IF" -j MASQUERADE
        iptables -A FORWARD -i "$$LAN_IF" -o "$$WAN_IF" -j ACCEPT
        iptables -A FORWARD -i "$$WAN_IF" -o "$$LAN_IF" -m state --state RELATED,ESTABLISHED -j ACCEPT
        # Block unsolicited inbound to robot LAN
        iptables -A FORWARD -i "$$WAN_IF" -o "$$LAN_IF" -m state --state NEW -j DROP
        echo "NAT gateway (robot) ready"
        sleep infinity
    networks:
      internet:
        ipv4_address: 10.0.0.20
      robot-lan:
        ipv4_address: 192.168.1.1

  # NAT gateway for the operator LAN.
  nat-gateway-operator:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    entrypoint:
      - /bin/sh
      - -ec
      - |
        WAN_IF=$$(ip -o -4 addr show | awk '$$4 == "10.0.0.30/24" {print $$2}')
        LAN_IF=$$(ip -o -4 addr show | awk '$$4 == "192.168.2.1/24" {print $$2}')
        iptables -t nat -A POSTROUTING -o "$$WAN_IF" -j MASQUERADE
        iptables -A FORWARD -i "$$LAN_IF" -o "$$WAN_IF" -j ACCEPT
        iptables -A FORWARD -i "$$WAN_IF" -o "$$LAN_IF" -m state --state RELATED,ESTABLISHED -j ACCEPT
        iptables -A FORWARD -i "$$WAN_IF" -o "$$LAN_IF" -m state --state NEW -j DROP
        echo "NAT gateway (operator) ready"
        sleep infinity
    networks:
      internet:
        ipv4_address: 10.0.0.30
      operator-lan:
        ipv4_address: 192.168.2.1

networks:
  internet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
  # Docker's bridge gateway is moved to .254 so the NAT gateway container
  # can own the conventional router address .1.
  robot-lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254
  operator-lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.254

volumes:
  relay-data:
  robot-data:
  operator-data:
  relay-shared:
