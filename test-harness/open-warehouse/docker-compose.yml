# Scenario 1: Open Warehouse
# Flat L2, permissive DHCP, no real egress controls.
# Direct TCP/QUIC connection between operator and robot.
# Multicast works. No relay needed.

services:
  # Relay with a fixed test identity (TEST KEY — DO NOT USE). The entrypoint
  # wrapper publishes the relay's dialable multiaddr to the shared volume so
  # agents can dial it and actually exercise gang connectivity.
  relay:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/relay-entrypoint.sh"]
    environment:
      GANG_KEY_PATH: /keys/relay.key
      RELAY_IP: 172.20.0.10
      RELAY_PORT: "4001"
    volumes:
      - relay-data:/data
      - ../scripts:/harness:ro
      - ../keys/open-warehouse-relay.key:/keys/relay.key:ro
      - relay-shared:/shared
    networks:
      warehouse:
        ipv4_address: 172.20.0.10

  robot:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/agent-entrypoint.sh"]
    volumes:
      - robot-data:/data
      - ../scripts:/harness:ro
      - relay-shared:/shared:ro
    networks:
      warehouse:
        ipv4_address: 172.20.0.20
    depends_on:
      - relay

  operator:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/agent-entrypoint.sh"]
    volumes:
      - operator-data:/data
      - ../scripts:/harness:ro
      - relay-shared:/shared:ro
    networks:
      warehouse:
        ipv4_address: 172.20.0.30
    depends_on:
      - relay
      - robot

networks:
  warehouse:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  relay-data:
  robot-data:
  operator-data:
  relay-shared:
