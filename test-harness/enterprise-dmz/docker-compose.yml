# Scenario 3: Enterprise DMZ
# VLAN isolation, restricted outbound ports (443 only), TLS inspection proxy.
# Robot connects outbound on port 443 through the proxy.
# No direct connectivity. Relay required. DCUtR unlikely to succeed.

services:
  # Relay on the public internet, listening on port 443 — the DMZ firewall
  # only allows TCP 443 egress, so the relay MUST listen there.
  # Fixed test identity (TEST KEY — DO NOT USE); the entrypoint wrapper
  # publishes the relay's dialable multiaddr to the shared volume.
  relay:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/relay-entrypoint.sh"]
    environment:
      GANG_KEY_PATH: /keys/relay.key
      RELAY_IP: 10.1.0.10
      RELAY_PORT: "443"
    volumes:
      - relay-data:/data
      - ../scripts:/harness:ro
      - ../keys/enterprise-dmz-relay.key:/keys/relay.key:ro
      - relay-shared:/shared
    networks:
      internet:
        ipv4_address: 10.1.0.10

  # Robot sits on an isolated VLAN. Outbound traffic must pass through
  # the firewall/proxy which only permits TCP 443.
  robot:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/agent-entrypoint.sh"]
    # NET_ADMIN so the entrypoint can repoint the default route at the
    # firewall container (Docker's bridge gateway would bypass it).
    cap_add:
      - NET_ADMIN
    environment:
      GATEWAY_IP: 172.16.10.1
    volumes:
      - robot-data:/data
      - ../scripts:/harness:ro
      - relay-shared:/shared:ro
    networks:
      robot-vlan:
        ipv4_address: 172.16.10.20
    depends_on:
      - dmz-firewall
      - relay

  # Operator has unrestricted internet access.
  operator:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/agent-entrypoint.sh"]
    volumes:
      - operator-data:/data
      - ../scripts:/harness:ro
      - relay-shared:/shared:ro
    networks:
      internet:
        ipv4_address: 10.1.0.30
    depends_on:
      - relay
      - robot

  # Enterprise firewall: NAT + strict egress rules.
  # Only allows outbound TCP 443 from the robot VLAN to the internet.
  # Blocks QUIC (UDP), blocks all other ports.
  # Built from the harness base image so iptables/iproute2 are available
  # without runtime apt (which would hang on internal-only networks).
  dmz-firewall:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # Interface names depend on network attachment order, so resolve
        # them from the statically assigned addresses.
        WAN_IF=$$(ip -o -4 addr show | awk '$$4 == "10.1.0.20/24" {print $$2}')
        VLAN_IF=$$(ip -o -4 addr show | awk '$$4 == "172.16.10.1/24" {print $$2}')

        # NAT outbound
        iptables -t nat -A POSTROUTING -o "$$WAN_IF" -j MASQUERADE

        # Allow established/related
        iptables -A FORWARD -m state --state RELATED,ESTABLISHED -j ACCEPT

        # Allow outbound TCP 443 only from robot VLAN
        iptables -A FORWARD -i "$$VLAN_IF" -o "$$WAN_IF" -p tcp --dport 443 -j ACCEPT

        # Block everything else from robot VLAN
        iptables -A FORWARD -i "$$VLAN_IF" -o "$$WAN_IF" -j DROP

        # Block all inbound to robot VLAN
        iptables -A FORWARD -i "$$WAN_IF" -o "$$VLAN_IF" -m state --state NEW -j DROP

        # Simulate 5ms extra latency (TLS inspection overhead)
        tc qdisc add dev "$$VLAN_IF" root netem delay 5ms

        echo "DMZ firewall ready — TCP 443 outbound only"
        sleep infinity
    networks:
      internet:
        ipv4_address: 10.1.0.20
      robot-vlan:
        ipv4_address: 172.16.10.1

networks:
  internet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.0.0/24
  # Docker's bridge gateway is moved to .254 so the firewall container
  # can own the conventional router address .1.
  robot-vlan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.16.10.0/24
          gateway: 172.16.10.254

volumes:
  relay-data:
  robot-data:
  operator-data:
  relay-shared:
