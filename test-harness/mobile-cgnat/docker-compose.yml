# Scenario 4: Mobile / CGNAT
# Symmetric NAT, carrier-grade NAT, IP rotation, intermittent connectivity.
# Relay-only connectivity — DCUtR will fail against symmetric NAT.
# Simulates cellular network conditions: jitter, packet loss, IP changes.

services:
  # Relay on the public internet.
  # Fixed test identity (TEST KEY — DO NOT USE); the entrypoint wrapper
  # publishes the relay's dialable multiaddr to the shared volume.
  relay:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/relay-entrypoint.sh"]
    environment:
      GANG_KEY_PATH: /keys/relay.key
      RELAY_IP: 10.2.0.10
      RELAY_PORT: "4001"
    volumes:
      - relay-data:/data
      - ../scripts:/harness:ro
      - ../keys/mobile-cgnat-relay.key:/keys/relay.key:ro
      - relay-shared:/shared
    networks:
      internet:
        ipv4_address: 10.2.0.10

  # Robot behind CGNAT — double NAT (carrier + local).
  robot:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/agent-entrypoint.sh"]
    # NET_ADMIN so the entrypoint can repoint the default route at the
    # inner NAT container (Docker's bridge gateway would bypass it).
    cap_add:
      - NET_ADMIN
    environment:
      GATEWAY_IP: 10.64.0.1
    volumes:
      - robot-data:/data
      - ../scripts:/harness:ro
      - relay-shared:/shared:ro
    networks:
      cgnat-inner:
        ipv4_address: 10.64.0.20
    depends_on:
      - cgnat-outer
      - cgnat-inner-nat
      - relay

  # Operator has normal internet access.
  operator:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    entrypoint: ["/bin/bash", "/harness/agent-entrypoint.sh"]
    volumes:
      - operator-data:/data
      - ../scripts:/harness:ro
      - relay-shared:/shared:ro
    networks:
      internet:
        ipv4_address: 10.2.0.30
    depends_on:
      - relay
      - robot

  # Inner NAT: local network NAT (e.g., mobile hotspot or site router).
  # Built from the harness base image so iptables/iproute2 are available
  # without runtime apt (this container sits on internal-only networks
  # and has no internet access at all).
  cgnat-inner-nat:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # Interface names depend on network attachment order, so resolve
        # them from the statically assigned addresses.
        POOL_IF=$$(ip -o -4 addr show | awk '$$4 == "100.64.0.20/24" {print $$2}')
        LAN_IF=$$(ip -o -4 addr show | awk '$$4 == "10.64.0.1/24" {print $$2}')

        # Relay-bound traffic must leave via the carrier NAT, not
        # Docker's bridge gateway (the pool network is internal anyway).
        ip route replace default via 100.64.0.1

        iptables -t nat -A POSTROUTING -o "$$POOL_IF" -j MASQUERADE
        iptables -A FORWARD -i "$$LAN_IF" -o "$$POOL_IF" -j ACCEPT
        iptables -A FORWARD -i "$$POOL_IF" -o "$$LAN_IF" -m state --state RELATED,ESTABLISHED -j ACCEPT
        iptables -A FORWARD -i "$$POOL_IF" -o "$$LAN_IF" -m state --state NEW -j DROP

        # Simulate mobile network conditions on the inner interface
        # 50ms base latency, 30ms jitter, 2% packet loss
        tc qdisc add dev "$$LAN_IF" root netem delay 50ms 30ms loss 2%

        echo "Inner NAT (local router) ready"
        sleep infinity
    networks:
      cgnat-pool:
        ipv4_address: 100.64.0.20
      cgnat-inner:
        ipv4_address: 10.64.0.1

  # Outer NAT: carrier-grade NAT. Symmetric — different mapping per destination.
  # Uses --random flag to simulate symmetric NAT behavior.
  cgnat-outer:
    build:
      context: ../..
      dockerfile: test-harness/Dockerfile.base
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    entrypoint:
      - /bin/sh
      - -ec
      - |
        WAN_IF=$$(ip -o -4 addr show | awk '$$4 == "10.2.0.20/24" {print $$2}')
        POOL_IF=$$(ip -o -4 addr show | awk '$$4 == "100.64.0.1/24" {print $$2}')

        # Symmetric NAT: --random ensures different external port per destination
        iptables -t nat -A POSTROUTING -o "$$WAN_IF" -j MASQUERADE --random

        iptables -A FORWARD -i "$$POOL_IF" -o "$$WAN_IF" -j ACCEPT
        iptables -A FORWARD -i "$$WAN_IF" -o "$$POOL_IF" -m state --state RELATED,ESTABLISHED -j ACCEPT
        iptables -A FORWARD -i "$$WAN_IF" -o "$$POOL_IF" -m state --state NEW -j DROP

        # Additional jitter at the carrier level
        tc qdisc add dev "$$WAN_IF" root netem delay 20ms 10ms loss 0.5%

        echo "CGNAT (carrier symmetric NAT) ready"
        sleep infinity
    networks:
      internet:
        ipv4_address: 10.2.0.20
      cgnat-pool:
        ipv4_address: 100.64.0.1

networks:
  internet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.2.0.0/24
  # Docker's bridge gateway is moved to .254 on both NATed networks so
  # the gateway containers can own the conventional router address .1.
  cgnat-pool:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 100.64.0.0/24
          gateway: 100.64.0.254
  cgnat-inner:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.64.0.0/24
          gateway: 10.64.0.254

volumes:
  relay-data:
  robot-data:
  operator-data:
  relay-shared:
